# config/packages/security.yaml

security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_dashboard
            logout:
                path: app_logout
                target: app_login
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /
    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/dashboard, roles: ROLE_USER }
        - { path: ^/etudiant, roles: ROLE_ADMIN }
        - { path: ^/enseignant, roles: ROLE_ADMIN }
        - { path: ^/salle, roles: ROLE_ADMIN }
        - { path: ^/soutenance/new, roles: ROLE_ADMIN }
        - { path: ^/soutenance/edit, roles: ROLE_ADMIN }
        - { path: ^/soutenance/delete, roles: ROLE_ADMIN }